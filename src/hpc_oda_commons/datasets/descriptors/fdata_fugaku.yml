dataset_id: dataset.fdata_fugaku
schema_version: oda.dataset.v0.1.0
name: F-DATA (Fugaku Jobs, Mar–Sep 2023)
version: 1.3.0
description: >
  Job records of Fugaku (Fujitsu A64FX) from F-DATA, by RIKEN R-CCS and the University of
  Bologna. The source spans March 2021–April 2024 in 38 monthly parquet files (about 24M
  jobs, 28 GB); this curation takes March–September 2023. Runtime is duration (seconds).
  Average and peak job power are mapped whole-job (avgpcon, maxpcon) and per requested
  node (avgpcon_per_node, maxpcon_per_node). Fugaku takes periodic maintenance outages of
  about three days.
systems: [Fugaku]
providers: ["RIKEN R-CCS", "University of Bologna"]
citation:
  doi: "10.5281/zenodo.11467483"
  url: "https://zenodo.org/records/11467483"
  papers:
    - title: "F-DATA: A Fugaku Workload Dataset for Job-centric Predictive Modelling in HPC Systems (Scientific Data, 2025)"
      doi: "10.1038/s41597-025-05633-1"
license: { spdx: CC-BY-4.0, gated: false }
tags: [fugaku, a64fx, fujitsu, arm, power]
