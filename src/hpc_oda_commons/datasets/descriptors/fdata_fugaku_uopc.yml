decode:
  format: parquet

targets:
  - schema: oda.job.v0.2.0
    mapping:
      job_id: { from: jid }
      start_time: { from: sdt, type: timestamp, format: iso8601 }
      end_time: { from: edt, type: timestamp, format: iso8601 }
      submit_time: { from: adt, type: timestamp, format: iso8601 }
      runtime_seconds: { from: duration, type: duration, unit: seconds }
      requested_seconds: { from: elpl, type: duration, unit: seconds }
      user: { from: usr, type: hash_identifier }
      name: { from: jnam }
      num_cores_req: { from: cnumr, type: integer }
      num_nodes_req: { from: nnumr, type: integer }
      num_cores_alloc: { from: cnumat, type: integer }
      num_nodes_alloc: { from: nnuma, type: integer }
      exit_code: { from: ec, type: integer }
      job_state: { from: "exit state" }
      pclass: { from: pclass }
      freq_req: { from: freq_req, type: integer }
      avgpcon: { from: avgpcon, type: number }
      maxpcon: { from: maxpcon, type: number }
      # The prediction targets: watts per node. F-DATA's power sums the nodes the job ran
      # on, but nnuma counts the allocated node shape, which Fugaku can pad: 1-node,
      # 48-core jobs are recorded with nnuma = 48 and would read ~2 W per node. So divide
      # by requested nodes, which match the nodes used. Null for a job requesting no
      # nodes (#204). The UoPC paper protocol does the same by default; only its node_count:
      # allocated option divides by nnuma, as the paper does (#228).
      avgpcon_per_node: { derive: "avgpcon / num_nodes_req" }
      maxpcon_per_node: { derive: "maxpcon / num_nodes_req" }
      embedding: { from: embedding }
    filter: { require_nonnull: [avgpcon_per_node, maxpcon_per_node, embedding] }
    output: { id: fdata_fugaku_uopc, path: data/datasets/fdata_fugaku_uopc/data.parquet }
