dataset_id: dataset.job_power.fdata_fugaku_uopc
schema_version: oda.dataset.v0.1.0
name: F-DATA (Fugaku Jobs, Dec 2023–Apr 2024, UoPC window)
version: 1.0.0
description: >
  Fujitsu/Fugaku job records from F-DATA (RIKEN R-CCS / University of Bologna), curated
  for job power prediction. This is the five-month window (2023-12 through 2024-04) the
  UoPC paper evaluates on (Antici et al., IEEE 11017729), tested from 2024-02-01. It is a
  separate dataset from `dataset.job_runtime.fdata_fugaku` on purpose: the two cover
  different months, and sharing one descriptor would mean sharing one prepared table, so
  preparing either window would overwrite the other's. Power targets are avgpcon and
  maxpcon (watts, whole job); the UoPC protocol divides both by allocated nodes. Each row
  also carries F-DATA's precomputed job `embedding`, which UoPC uses as its main feature.
problem_domains: [job-power-prediction]
systems: [Fugaku]
providers: ["RIKEN R-CCS", "University of Bologna"]
citation: { doi: "10.5281/zenodo.11467483", url: "https://zenodo.org/records/11467483" }
license: { spdx: CC-BY-4.0, gated: false }
tags: [fugaku, a64fx, fujitsu, arm, power, uopc]
size:
  default_bytes: 3858208484
  full_bytes: 28000000000
  rows_hint: "Dec 2023-Apr 2024 (5 months)"

