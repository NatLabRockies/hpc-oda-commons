dataset_id: dataset.job_runtime.fdata_fugaku
schema_version: oda.dataset.v0.1.0
name: F-DATA (Fugaku Jobs, Mar–Sep 2023)
version: 1.2.0
description: >
  Fujitsu/Fugaku job records from F-DATA (RIKEN R-CCS / University of Bologna).
  This descriptor curates a seven-month slice (2023-03 through 2023-09). The benchmark's
  rolling split trains on a 120-day lookback, so the card window needs ~60 days of history
  behind it; the previous three-month curation (2023-07..09) put the window on the first day
  of the ingested span, leaving every rolling window short of history. Seven months puts the
  80%-anchored window far enough in to be backed by real history. Fugaku takes periodic
  ~3-day maintenance outages, so the window rule health-gates and shifts the window off any
  missing block. The full dataset spans Mar 2021 - Apr 2024 (38 monthly parquet files, ~24M
  jobs, ~28 GB). Runtime-prediction target = duration (seconds).
  Rich per-job power/perf counters (econ, avg/min/max pcon, flops, mbwidth) are
  available for a later power phase.
problem_domains: [job-runtime-prediction, job-power-prediction]
systems: [Fugaku]
providers: ["RIKEN R-CCS", "University of Bologna"]
citation: { doi: "10.5281/zenodo.11467483", url: "https://zenodo.org/records/11467483" }
license: { spdx: CC-BY-4.0, gated: false }
tags: [fugaku, a64fx, fujitsu, arm, power]
