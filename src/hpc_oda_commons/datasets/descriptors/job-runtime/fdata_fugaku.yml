    available:
      runtime_clean:
        description: "Clean Jul-Sep 2023 runtime benchmark window"
        include:
          - "23_07.parquet"
          - "23_08.parquet"
          - "23_09.parquet"

      uopc_reproduction:
        description: "Five-month Dec 2023-Apr 2024 UoPC reproduction window"
        include:
          - "23_12.parquet"
          - "24_01.parquet"
          - "24_02.parquet"
          - "24_03.parquet"
          - "24_04.parquet"

decode:
  format: parquet

targets:
  - schema: oda.job.v0.2.0
    capabilities:
      - { problem_domain: job-runtime-prediction, target_column: runtime_seconds }
      - { problem_domain: job-power-prediction, target_column: avgpcon }
      - { problem_domain: job-power-prediction, target_column: maxpcon }
    suitable_models:
      - model.job_runtime_baseline
      - model.job_runtime_xgboost
      - model.job_power_uopc
    mapping:
      job_id: { from: jid }
      start_time: { from: sdt, type: timestamp, format: iso8601 }
      end_time: { from: edt, type: timestamp, format: iso8601 }
      submit_time: { from: adt, type: timestamp, format: iso8601 }
      runtime_seconds: { from: duration, type: duration, unit: seconds }
      requested_seconds: { from: elpl, type: duration, unit: seconds }
      user: { from: usr, type: hash_identifier }
      name: { from: jnam }
      num_cores_req: { from: cnumr, type: integer }
      num_nodes_req: { from: nnumr, type: integer }
      num_cores_alloc: { from: cnumat, type: integer }
      num_nodes_alloc: { from: nnuma, type: integer }
      exit_code: { from: ec, type: integer }
      job_state: { from: "exit state" }
      pclass: { from: pclass }
      avgpcon: { from: avgpcon, type: number }
      maxpcon: { from: maxpcon, type: number }
      nnuma: { from: nnuma, type: number }
      freq_req: { from: freq_req, type: number }
      embedding: { from: embedding }
    filter: { require_nonnull: [runtime_seconds] }
    output: { id: fdata_fugaku, path: data/datasets/fdata_fugaku/data.parquet }
