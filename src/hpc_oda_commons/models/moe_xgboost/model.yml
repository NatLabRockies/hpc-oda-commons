# What this model is: fixed facts kept next to its code (#249). Its id comes from the folder,
# the tasks it serves from the recipes that run it, and its dependencies from its imports.
name: XGBoost (MoE)
version: 0.1.0
object: MoEXGBoostModel
description: >
  Mixture of experts: routes each job to an XGBoost expert for its user and requested
  walltime bin, with the bin edges taken from each training window, a window-wide fallback
  expert for sparse bins, and exponential time-decay sample weights.
