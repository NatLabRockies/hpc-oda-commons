# Embedding kNN predicting average power per node on NLR Kestrel (#219), on the
# rolling protocol of #217: 89 daily windows, 60 days of history. The windows
# end at the table's last submit, so they cover Kestrel's last 89 days; the slice only keeps
# the table small enough to load.
#
# Kestrel ships no job embedding, so one is computed from the submission fields
# (partition, qos, account, user, requested walltime/nodes/cores/GPUs, weekday and hour of
# submission). Each distinct description is encoded once: about 60k here, minutes on a laptop.
#
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/job-runtime/nlr_kestrel.yml
#   hpc-oda datasets slice data/datasets/nlr_kestrel/data.parquet \
#     --start 2025-08-01 --end 2026-01-01 --out data/windows/nlr_kestrel_power/data.parquet
#   hpc-oda embed data/windows/nlr_kestrel_power/data.parquet \
#     --out data/windows/nlr_kestrel_power_embedded/data.parquet \
#     --model microsoft/harrier-oss-v1-0.6b --format prose      # needs the `embed` extra
#
# The embedded table keeps every row, so it scores the same jobs as the other
# recipes/job-power/*_rolling_avg_kestrel.yml.

recipe_id: recipe.job_power.embedding_knn_rolling_avg_kestrel

problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: nlr_kestrel
  table_path: data/windows/nlr_kestrel_power_embedded/data.parquet

model:
  id: model.job_runtime_embedding_knn
  version: "0.1.0"

metrics:
  - name: mae
    target: avgpcon_per_node
  - name: rmse
    target: avgpcon_per_node
  - name: mape
    target: avgpcon_per_node
  - name: r2
    target: avgpcon_per_node

split:
  method: rolling
  n_windows: 89
  test_window_hours: 24
  training_lookback_days: 60
  k: 5

run:
  output_dir: runs
  overwrite: false
