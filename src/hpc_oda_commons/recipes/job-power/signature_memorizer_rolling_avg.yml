# Signature memorization predicting average power per node, on the shared rolling
# protocol (#204): 89 daily windows ending at the last submit, so testing starts
# around 2024-02-01 like the UoPC paper reproduction, with 60 days of history.
# Every model in recipes/job-power/*_rolling_*.yml uses the same split and rows.

recipe_id: recipe.job_power.signature_memorizer_rolling_avg

problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku
  table_path: data/datasets/fdata_fugaku/data.parquet
  # The jobs submitted December 2023-April 2024, as F-DATA's monthly files cut them: a file
  # holds a Japan-time month, so December begins at 2023-11-30 15:00 UTC.
  window: { start: "2023-11-30", end: "2024-04-30", by: submit }
  require_nonnull: [avgpcon_per_node, maxpcon_per_node, embedding]

model:
  id: model.signature_memorizer
  version: "0.1.0"

metrics:
  - name: mae
    target: avgpcon_per_node
  - name: rmse
    target: avgpcon_per_node
  - name: mape
    target: avgpcon_per_node
  - name: r2
    target: avgpcon_per_node

split:
  method: rolling
  n_windows: 89
  test_window_hours: 24
  training_lookback_days: 60

run:
  output_dir: runs
  overwrite: false
