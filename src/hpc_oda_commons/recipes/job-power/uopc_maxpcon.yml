# UoPC user-based kNN recipe for Fugaku max job power (maxpcon) prediction.
# Related work: https://ieeexplore.ieee.org/abstract/document/11017729
# The Commons adaptation on a fixed split; the paper's own protocol is
# uopc_paper_reproduction.yml. Prepare the dataset first:
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/fdata_fugaku.yml
#
# It reads April 2024 of the prepared F-DATA table, the month the example once read from a
# hand-placed file.

recipe_id: recipe.job_power.uopc_fugaku_maxpcon
problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku
  table_path: data/datasets/fdata_fugaku/data.parquet
  window: { start: "2024-04-01", end: "2024-04-30" }
  require_nonnull: [maxpcon]

model:
  id: model.uopc
  version: "0.1.0"

metrics:
  - name: mae
    target: maxpcon
  - name: rmse
    target: maxpcon

split:
  method: fixed
  train_fraction: 0.8
  seed: 42

run:
  output_dir: runs
  overwrite: false
