# UoPC paper reproduction (Antici et al., IEEE 11017729) through the Commons benchmark: the
# paper's protocol with only the choices we can defend (#228). Scores every job submitted
# on/after test_start, predicting avgpcon and maxpcon per requested node from the user's
# newest `theta` finished jobs. uopc_paper_reproduction_paper_setup.yml runs the authors'
# setup for comparison. Results, and why they differ: docs/benchmarking/power/uopc.md (#125).
#
# Prepare the data first (5 monthly files, ~3.9 GB):
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/fdata_fugaku_uopc.yml

recipe_id: recipe.job_power.uopc_paper_reproduction

problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku_uopc
  table_path: data/datasets/fdata_fugaku_uopc/data.parquet

model:
  id: model.uopc
  version: "0.1.0"

metrics:
  - name: mae
    target: avgpcon_per_node
  - name: rmse
    target: avgpcon_per_node
  - name: mape
    target: avgpcon_per_node
  - name: r2
    target: avgpcon_per_node

split:
  method: cutoff
  # Our settings (#228): per requested node, because F-DATA pads allocated counts, and
  # balanced features. Both are the model's defaults; stated here so the recipe says them.
  node_count: requested
  uopc_features: balanced
  test_start: "2024-02-01"
  # theta is the paper's. k = 20 is ours: the sweep on these settings puts it ~0.4 MAPE
  # points ahead of the paper's k = 5 (#228).
  theta: 500
  k: 20
  # Ours: the median of the k neighbours' values, not the authors' vote over whole watts.
  # It has the lowest MAE on both targets of the three predictors (#241).
  predictor: median

run:
  output_dir: runs
  overwrite: false
  extras:
    save_predictions: true
