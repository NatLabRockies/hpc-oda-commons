# UoPC paper reproduction on the authors' setup, for comparison with the paper (#228).
# Identical to uopc_paper_reproduction.yml except that power is divided by allocated nodes,
# as the paper does, and features are zscore. F-DATA pads allocated counts, so ~150k test
# jobs read ~2 W per node here; our own result is uopc_paper_reproduction.yml.
# docs/benchmarking/uopc.md#comparison-with-the-paper.
#
# Prepare the data first (5 monthly files, ~3.9 GB):
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/job-power/fdata_fugaku_uopc.yml

recipe_id: recipe.job_power.uopc_paper_reproduction_paper_setup

problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku_uopc
  table_path: data/datasets/fdata_fugaku_uopc/data.parquet

model:
  id: model.job_power_uopc
  version: "0.1.0"

metrics:
  - name: mae
    target: avgpcon_per_node
  - name: rmse
    target: avgpcon_per_node
  - name: mape
    target: avgpcon_per_node
  - name: r2
    target: avgpcon_per_node

split:
  method: cutoff
  # The authors' setup, for comparison with the paper only (#228): per allocated node, as
  # the paper divides, with the zscore features the earlier reproduction used.
  node_count: allocated
  uopc_features: zscore
  test_start: "2024-02-01"
  # The paper's theta and k.
  theta: 500
  k: 5

run:
  output_dir: runs
  overwrite: false
  extras:
    save_predictions: true
