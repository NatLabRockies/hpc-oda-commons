# UoPC paper reproduction per requested node (#222).
# Divides power by requested nodes, as the rolling benchmark's avgpcon_per_node does, so
# its numbers are on the same target as uopc_rolling_avg.yml; what remains between the two
# is mostly the history cutoff. Otherwise identical to uopc_paper_reproduction.yml.
# Results: docs/benchmarking/uopc.md.
#
# Prepare the data first (5 monthly files, ~3.9 GB):
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/job-power/fdata_fugaku_uopc.yml

recipe_id: recipe.job_power.uopc_paper_reproduction_requested

problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku_uopc
  table_path: data/datasets/fdata_fugaku_uopc/data.parquet

model:
  id: model.job_power_uopc
  version: "0.1.0"

metrics:
  - name: mae
    target: avgpcon_per_node
  - name: rmse
    target: avgpcon_per_node
  - name: mape
    target: avgpcon_per_node
  - name: r2
    target: avgpcon_per_node

split:
  method: cutoff
  # The published reproduction results use zscore features; balanced is the model
  # default since #222 (docs/benchmarking/uopc.md#feature-modes).
  uopc_features: zscore
  test_start: "2024-02-01"
  theta: 500
  k: 5
  node_count: requested

run:
  output_dir: runs
  overwrite: false
  extras:
    save_predictions: true
