# UoPC paper reproduction without F-DATA's most padded jobs (#222).
# The paper's figures show no jobs below ~10 W per allocated node, but the public F-DATA
# files hold ~150k test jobs allocated 24x or 48x the nodes they requested (~2-4 W per
# allocated node). max_alloc_ratio: 12 drops every job allocated more than 12x its request,
# from history and test, to match the paper's apparent data. Otherwise identical to
# uopc_paper_reproduction_paper_setup.yml: a comparison with the paper, not our result.
# Results: docs/benchmarking/power/uopc.md.
#
# Prepare the data first (5 monthly files, ~3.9 GB):
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/job-power/fdata_fugaku_uopc.yml

recipe_id: recipe.job_power.uopc_paper_reproduction_unpadded

problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku_uopc
  table_path: data/datasets/fdata_fugaku_uopc/data.parquet

model:
  id: model.uopc
  version: "0.1.0"

metrics:
  - name: mae
    target: avgpcon_per_node
  - name: rmse
    target: avgpcon_per_node
  - name: mape
    target: avgpcon_per_node
  - name: r2
    target: avgpcon_per_node

split:
  method: cutoff
  # The authors' setup, for comparison with the paper only (#228): per allocated node, as
  # the paper divides, with the zscore features the earlier reproduction used.
  node_count: allocated
  uopc_features: zscore
  test_start: "2024-02-01"
  # The paper's theta and k.
  theta: 500
  k: 5
  # The authors' rule (#241): KNeighborsClassifier over power rounded to whole watts. Our
  # result predicts from the neighbours' values instead.
  predictor: vote
  max_alloc_ratio: 12

run:
  output_dir: runs
  overwrite: false
  extras:
    save_predictions: true
