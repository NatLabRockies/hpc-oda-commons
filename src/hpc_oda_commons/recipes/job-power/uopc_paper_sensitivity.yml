# UoPC theta x k sensitivity sweep (Antici et al., IEEE 11017729) through the Commons
# benchmark, on the same data and cutoff as uopc_paper_reproduction.yml. metrics.json holds
# the whole grid (classifier voting, plus the kNN-regressor ablation) and cold-start counts;
# the headline metrics are the classifier at theta/k below. See docs/benchmarking/power/uopc.md.
#
# Prepare the data first (5 monthly files, ~3.9 GB):
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/job-power/fdata_fugaku_uopc.yml

recipe_id: recipe.job_power.uopc_paper_sensitivity

problem_domain:
  - job-power-prediction

schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku_uopc
  table_path: data/datasets/fdata_fugaku_uopc/data.parquet

model:
  id: model.job_power_uopc
  version: "0.1.0"

metrics:
  - name: mae
    target: avgpcon_per_node
  - name: rmse
    target: avgpcon_per_node
  - name: mape
    target: avgpcon_per_node
  - name: r2
    target: avgpcon_per_node

split:
  method: cutoff
  # Our settings (#228): per requested node, because F-DATA pads allocated counts, and
  # balanced features. Both are the model's defaults; stated here so the recipe says them.
  node_count: requested
  uopc_features: balanced
  test_start: "2024-02-01"
  theta_values: [50, 100, 200, 500, 1000, 2000, 5000]
  k_values: [5, 10, 20, 50]
  # The headline result; must be in the grid above. k = 20 is ours (#228); the paper's is 5.
  theta: 500
  k: 20

run:
  output_dir: runs
  overwrite: false
