# Tiny synthetic benchmark recipe for job runtime prediction.
# Used for CI smoke tests and offline demo runs.

recipe_id: recipe.job_runtime.baseline_tiny
problem_domain:
  - job-runtime-prediction

# Input data schema version required by this recipe.
schema_version: oda.job.v0.2.0

dataset:
  id: hpc_oda_commons/datasets/synthetic/job-runtime/tiny
  table_path: hpc_oda_commons/datasets/synthetic/job-runtime/tiny/data.parquet
  manifest_path: hpc_oda_commons/datasets/synthetic/job-runtime/tiny/manifest.json

model:
  id: model.baseline
  version: "0.1.0"

# Every recipe reports at least MAE and RMSE, on one target column.
metrics:
  - name: mae
    target: runtime_seconds
  - name: rmse
    target: runtime_seconds

# A simple deterministic split.
split:
  method: fixed
  train_fraction: 0.8
  seed: 42

run:
  output_dir: runs
  overwrite: false
