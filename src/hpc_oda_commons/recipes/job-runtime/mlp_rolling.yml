# Rolling feed-forward MLP recipe for runtime prediction.
# Uses automatic categorical preprocessing (OHE + SVD) + daily preprocessing refresh.
#
# Prepare the dataset first:
#   hpc-oda datasets prepare src/hpc_oda_commons/datasets/descriptors/fdata_fugaku.yml
#
# It reads April 2024 of the prepared F-DATA table, the month the example once read from a
# hand-placed file.

recipe_id: recipe.job_runtime.mlp_rolling
problem_domain:
  - job-runtime-prediction
schema_version: oda.job.v0.2.0

dataset:
  id: fdata_fugaku
  table_path: data/datasets/fdata_fugaku/data.parquet
  window: { start: "2024-04-01", end: "2024-04-30" }

model:
  id: model.mlp
  version: "0.1.0"

metrics:
  - name: mae
    target: runtime_seconds
  - name: rmse
    target: runtime_seconds
  - name: underprediction_ratio
    target: runtime_seconds

split:
  method: rolling
  n_windows: 20
  test_window_hours: 6
  training_lookback_days: 7

run:
  output_dir: runs
  overwrite: false
