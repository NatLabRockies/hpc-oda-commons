# Mixture-of-Experts XGBoost rolling recipe for runtime prediction.
# Routes each job to a per-(user, wallclock-bin) expert inside the shared rolling
# window, with bin edges derived from each training window and a fallback expert
# for sparse bins.
#
# Place ingested data at:
#   data/ingested/jobs_parquet/fugaku_24_04/data.parquet
#   data/ingested/jobs_parquet/fugaku_24_04/manifest.json
# (relative to the repo root when running `hpc-oda benchmark`)

recipe_id: recipe.job_runtime.moe_xgboost_rolling
problem_domain:
  - job-runtime-prediction
schema_version: oda.job.v0.2.0

dataset:
  id: fugaku_24_04
  table_path: data/ingested/jobs_parquet/fugaku_24_04/data.parquet
  manifest_path: data/ingested/jobs_parquet/fugaku_24_04/manifest.json

model:
  id: model.job_runtime_moe_xgboost
  version: "0.1.0"

metrics:
  - name: mae
    target: runtime_seconds
  - name: rmse
    target: runtime_seconds
  - name: underprediction_ratio
    target: runtime_seconds

split:
  method: rolling
  n_windows: 20
  test_window_hours: 6
  training_lookback_days: 7
  # Routing knobs (all optional; these are the defaults).
  # time_decay_rate: 0.0           # exp(-rate * days_old) recency weighting; 0.05 ~ 2wk half-life
  # power_user_percentile: 0.99    # job-count quantile above which a user gets experts
  # min_expert_rows: 100           # below this a bin uses the window-wide fallback
  # n_wallclock_bins: 5            # maximum bins derived per training window
  # wallclock_bin_edges_hours: []  # pin the edges instead of deriving them

run:
  output_dir: runs
  overwrite: false
