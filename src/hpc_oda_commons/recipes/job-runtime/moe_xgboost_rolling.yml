# Mixture-of-Experts XGBoost rolling model recipe for runtime prediction.
# Routes jobs to per-bin XGBoost models by user identity and wallclock cluster,
# with exponential time-decay sample weighting.

recipe_id: recipe.job_runtime.moe_xgboost_rolling
problem_domain:
  - job-runtime-prediction
schema_version: oda.job.v0.2.0

dataset:
  id: hpc_oda_commons/datasets/synthetic/job-runtime/tiny
  table_path: hpc_oda_commons/datasets/synthetic/job-runtime/tiny/data.parquet
  manifest_path: hpc_oda_commons/datasets/synthetic/job-runtime/tiny/manifest.json

model:
  id: model.job_runtime_moe_xgboost
  version: "0.1.0"

metrics:
  - name: mae
    target: runtime_seconds
  - name: rmse
    target: runtime_seconds

split:
  method: rolling
  n_windows: 1000
  test_window_hours: 6
  training_lookback_days: 100
  time_decay_rate: 0.05
  power_user_percentile: 0.99
  estimator_n_jobs: 1

run:
  output_dir: runs
  overwrite: false
